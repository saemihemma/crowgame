name: Web CI

# Regression gate for the Phaser/TypeScript web build — the target that actually
# ships to Railway. Until this existed, ci.yml only ran the Godot suite and was
# path-filtered to `godot/**`, so a pull request touching only `src/**` got no
# automated checks at all: the type checker, the content/docs/asset validators
# and the i18n guard were all manual.
#
# Two jobs, deliberately separate:
#
#   checks — fast, and validates the *committed* browser-smoke artifact. This is
#            what catches "you changed fingerprinted source and did not re-run
#            the smoke", which is the whole point of that artifact.
#   smoke  — runs the browser smoke fresh against a dev server, proving the live
#            owl/math flow still works rather than trusting a checked-in report.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tools/**'
      - 'admin.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite/**'
      - '*.md'
      - 'docs/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tools/**'
      - 'admin.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite/**'
      - '*.md'
      - 'docs/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  checks:
    name: Types, content, docs, assets, i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Covers tools/validate-content.ts, validate_docs.js, validate_assets.js
      # and validate_i18n.mjs. The i18n guard enforces the Latin-1 glyph
      # allowlist, web/Godot bundle parity, EN/IS lockstep and the per-string fit
      # budget; validate_docs enforces roadmap hygiene.
      - name: Validate content, docs, assets and i18n
        run: npm run validate

  smoke:
    name: Browser smoke (live math flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The smoke drives a real browser. ubuntu-latest ships Chrome and Chromium;
      # fail loudly rather than let the harness fall through to its Windows
      # fallback paths and report a confusing "could not find a browser".
      - name: Resolve a browser
        run: |
          set -euo pipefail
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "No Chrome/Chromium found on the runner." >&2
          exit 1

      - name: Start dev server
        run: |
          set -euo pipefail
          npx vite --config vite/config.dev.mjs > /tmp/vite.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "dev server up"
              exit 0
            fi
            sleep 1
          done
          echo "dev server never came up:" >&2
          cat /tmp/vite.log >&2
          exit 1

      # The dev server answers a missing file with index.html, so a missing .wav
      # would be decoded as HTML and surface as a console error that fails the
      # smoke's console gate. The SFX are committed, so assert every file the
      # audio manifest declares is there rather than debugging that indirection
      # later. The expected count comes from the manifest itself, not a magic
      # number that goes stale the next time a sound is added.
      - name: Check SFX are present
        run: |
          set -euo pipefail
          expected=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('public/data/audio/audio_manifest.json','utf8')).sfx).length)")
          count=$(ls public/assets/audio/sfx/*.wav 2>/dev/null | wc -l)
          echo "found $count sfx, manifest declares $expected"
          [ "$count" -eq "$expected" ]

      - name: Run browser smoke
        env:
          CROW_DEV_URL: http://localhost:8080/
        run: npm run math:browser-smoke

      # Drives the Pause settings and proves the live surfaces re-render: the
      # touch labels change language with the scene never restarting. Watched
      # failing when the TouchControls subscription is removed, and it refuses to
      # pass vacuously if the touch emulation did not apply.
      - name: Pause settings and live locale re-render
        env:
          CROW_DEV_URL: http://localhost:8080/
        run: npm run locale:pause-check

      # Plays a real level in English and in Icelandic and reads the rendered
      # question back out of the game. Everything else compares `prompt.text`,
      # which is canonical English in every locale by design -- so before this
      # existed, a build that showed a child nothing but English passed the whole
      # suite. It also rejects a vacuous pass, where every sampled prompt happened
      # to be wordless arithmetic and no translated string was ever rendered.
      - name: Check both locales render
        env:
          CROW_DEV_URL: http://localhost:8080/
        run: npm run locale:play-check

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            reports/math-batches/runtime-browser-smoke.json
            output/playwright/math-browser-smoke/
            output/playwright/locale-play/
          if-no-files-found: warn
