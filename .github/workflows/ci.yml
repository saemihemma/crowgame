name: CI

# Regression gate for Crow.
#
# Two things are gated here, and the second one used to be on the honour system:
#
#  1. The Godot game: headless GDScript suite + physics integration probes.
#  2. The parity oracle: `math-kernel/**` is the TypeScript reference
#     implementation that GENERATES godot/tests/fixtures/*.json. The Godot
#     Tier-1 constants are only trustworthy if those committed fixtures still
#     match what the kernel produces. The old `paths: ['godot/**']` filter meant
#     a change to the kernel, the generators, or the shipped data ran NO CI at
#     all — so the most load-bearing invariant in the repo was unchecked.
#
# There is deliberately no paths filter now. This suite is minutes long; a
# skipped run that should have failed costs far more than a redundant one.

on:
  push:
    branches: [main, release]
    paths-ignore: ['output/web/**', '**/*.md']
  pull_request:
    branches: [main, release]
    paths-ignore: ['output/web/**', '**/*.md']
  workflow_dispatch:

jobs:
  godot-tests:
    name: Godot suite (unit + physics probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.3-stable-linux

      - name: Install Godot 4.3 (headless)
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv Godot_v4.3-stable_linux.x86_64 "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Run test suite (guard + unit + probes)
        run: bash godot/tools/run_tests.sh

  parity-gate:
    name: Parity oracle (kernel -> fixtures -> Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Regenerate golden fixtures from the TS kernel
        run: |
          npm run godot:gen-math-fixtures
          npm run godot:gen-motion-fixtures

      - name: Fail if committed fixtures drifted from the kernel
        run: |
          if ! git diff --exit-code -- godot/tests/fixtures/; then
            echo "::error::godot/tests/fixtures/ does not match what math-kernel/ generates."
            echo "A Tier-1 change must regenerate the fixtures in the same commit:"
            echo "  npm run godot:gen-math-fixtures && npm run godot:gen-motion-fixtures"
            exit 1
          fi
          echo "fixtures match the kernel"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.3-stable-linux

      - name: Install Godot 4.3 (headless)
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv Godot_v4.3-stable_linux.x86_64 "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Godot must reproduce the regenerated fixtures
        run: |
          godot --headless --path godot --import >/dev/null 2>&1 || true
          godot --headless --path godot res://tests/TestRunner.tscn

  content-validate:
    name: Content and docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate content, docs and assets
        run: npm run validate
