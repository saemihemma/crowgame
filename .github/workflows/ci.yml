name: CI

# Regression gate for Crow.
#
# Two things are gated here, and the second one used to be on the honour system:
#
#  1. The Godot game: headless GDScript suite + physics integration probes.
#  2. The parity oracle: `math-kernel/**` is the TypeScript reference
#     implementation that GENERATES godot/tests/fixtures/*.json. The Godot
#     Tier-1 constants are only trustworthy if those committed fixtures still
#     match what the kernel produces. The old `paths: ['godot/**']` filter meant
#     a change to the kernel, the generators, or the shipped data ran NO CI at
#     all — so the most load-bearing invariant in the repo was unchecked.
#
# There is deliberately no paths filter now. This suite is minutes long; a
# skipped run that should have failed costs far more than a redundant one.

on:
  # NO paths filter, deliberately, and that now includes output/web.
  #
  # Markdown is not ignored: doc validation is the check most likely to be needed
  # by a docs-only change, and ignoring .md turned it off for exactly that case.
  #
  # output/web is no longer ignored either, and that was a real hole. It is the
  # deployed artifact, and `npm run validate` carries the export-freshness gate
  # that exists to prove it matches godot/**. Ignoring the path meant a commit
  # touching ONLY output/web — a hand-edit, a partial copy, a re-export from the
  # wrong tree — skipped the one check written to catch it, and left a red trunk
  # green after a fix-by-re-export. The gate has to run on the file it guards.
  push:
    # Agent branches are included so their greenness is a fact rather than a
    # manual dispatch. This whole hardening pass began with nine commits pushed
    # and called green while CI had never seen the branch at all.
    branches: [main, release, 'claude/**']
  pull_request:
    branches: [main, release]
  workflow_dispatch:

# One run per ref. Pushing three commits in a row used to start three full runs
# and let all three finish; only the last one's result means anything. main and
# release are exempt: on a protected branch the run IS the record of that commit,
# and cancelling it loses the answer to "was this commit green".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

jobs:
  godot-tests:
    name: Godot suite (unit + physics probes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # This job never opens output/web, so it does not need to fetch it.
          # Measured: 68 MB of working tree becomes 20 MB. Verified locally that
          # the pattern excludes ONLY output/web and leaves godot/, math-kernel/,
          # server/ and tools/ intact -- non-cone mode, because cone mode cannot
          # express an exclusion.
          #
          # content-validate and error-pipeline-e2e deliberately do NOT do this:
          # one derives the payload table and the export fingerprint FROM those
          # bytes, the other serves them to a browser.
          sparse-checkout: |
            /*
            !/output/web/
          sparse-checkout-cone-mode: false

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.3-stable-linux

      - name: Install Godot 4.3 (headless)
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv Godot_v4.3-stable_linux.x86_64 "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Run test suite (guard + unit + probes)
        run: bash godot/tools/run_tests.sh

  parity-gate:
    name: Parity oracle (kernel -> fixtures -> Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # This job never opens output/web, so it does not need to fetch it.
          # Measured: 68 MB of working tree becomes 20 MB. Verified locally that
          # the pattern excludes ONLY output/web and leaves godot/, math-kernel/,
          # server/ and tools/ intact -- non-cone mode, because cone mode cannot
          # express an exclusion.
          #
          # content-validate and error-pipeline-e2e deliberately do NOT do this:
          # one derives the payload table and the export fingerprint FROM those
          # bytes, the other serves them to a browser.
          sparse-checkout: |
            /*
            !/output/web/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Regenerate golden fixtures from the TS kernel
        run: |
          npm run godot:gen-math-fixtures
          npm run godot:gen-motion-fixtures

      - name: Fail if committed fixtures drifted from the kernel
        run: |
          if ! git diff --exit-code -- godot/tests/fixtures/; then
            echo "::error::godot/tests/fixtures/ does not match what math-kernel/ generates."
            echo "A Tier-1 change must regenerate the fixtures in the same commit:"
            echo "  npm run godot:gen-math-fixtures && npm run godot:gen-motion-fixtures"
            exit 1
          fi
          echo "fixtures match the kernel"

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.3-stable-linux

      - name: Install Godot 4.3 (headless)
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv Godot_v4.3-stable_linux.x86_64 "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Godot must reproduce the regenerated fixtures
        run: |
          godot --headless --path godot --import >/dev/null 2>&1 || true
          godot --headless --path godot res://tests/TestRunner.tscn

  content-validate:
    name: Content and docs validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FULL history, blobs filtered.
      #
      # The doc validator dates each `Last verified against code:` stamp against
      # git history, and it can only judge a file whose real last-touch commit is
      # in the clone. This was `fetch-depth: 2`, which meant it judged only the
      # `.md` files changed in the tip commit and declined every other one — 0 of
      # 19 on a commit that touched no docs, and a stale stamp introduced in any
      # commit but the last of a push was invisible.
      #
      # The depth was chosen to avoid refetching the 47 MB export, which confused
      # depth with blob filtering. Measured on this repo as PACKED bytes — what
      # actually crosses the wire, `%(objectsize:disk)` rather than the inflated
      # `%(objectsize)` an earlier version of this comment quoted: commits 0.2 MB,
      # trees 0.2 MB, blobs 140 MB. So `filter: 'blob:none'` is what controls the
      # cost and the depth controls how much of the gate works — two orders of
      # magnitude apart either way you measure it. Note the filter only skips
      # HISTORICAL blobs; the ~66 MB any checkout must materialize for HEAD is
      # unavoidable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck the reference kernel and the toolchain
        run: npm run typecheck
      # Includes the colour law: 66 checks that the world palettes obey
      # BRAND_SYSTEM §6, run against godot/data/themes because that is what the
      # game loads. It was a separate step against a duplicate copy in
      # brand/tokens/, which meant it could pass while the shipped palettes drifted.
      - name: Validate content, docs, assets and palettes
        run: npm run validate

      # The gate above is only as good as this job's checkout depth, and the
      # depth is defended by nothing except the literal 0 above — which is the
      # honour system that let the same gate ship broken three times. This proves
      # the deployed configuration: it builds full-depth, depth-2 and depth-1
      # clones, asserts a depth regression FAILS rather than quietly narrowing,
      # and asserts each failure's reason so a validator too broken to parse
      # cannot read as a caught defect.
      - name: The doc gate must actually gate
        run: npm run validate:docs-test

  api:
    name: API (server tests against Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          # This job never opens output/web, so it does not need to fetch it.
          # Measured: 68 MB of working tree becomes 20 MB. Verified locally that
          # the pattern excludes ONLY output/web and leaves godot/, math-kernel/,
          # server/ and tools/ intact -- non-cone mode, because cone mode cannot
          # express an exclusion.
          #
          # content-validate and error-pipeline-e2e deliberately do NOT do this:
          # one derives the payload table and the export fingerprint FROM those
          # bytes, the other serves them to a browser.
          sparse-checkout: |
            /*
            !/output/web/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server deps
        run: npm --prefix server ci
      - name: Typecheck
        run: npm --prefix server run typecheck
      - name: Migrate
        run: npm --prefix server run migrate
      - name: Test
        # The throttle and the partition-drop retention are SQL behaviour, so
        # these run against a real Postgres rather than a mock.
        run: npm --prefix server test

  error-pipeline-e2e:
    name: Error pipeline end-to-end (browser -> API -> Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crow_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crow_e2e?sslmode=disable
      # Runners ship Chrome; no browser download needed.
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      # No Godot needed for either step: output/web is committed, so both
      # exercise the exact bytes that get deployed.
      - name: Run the pipeline end to end
        run: npm run e2e:errors

      # ONBOARDING.md calls this "not optional for a shipping change" and names
      # "trusting the source suite about the export" as a known failure mode of
      # this project — and it was on the honour system, referenced nowhere in CI.
      # It needs only the committed export and a browser, both of which this job
      # already has, so it costs one step. It gates the render (>=256 distinct
      # canvas colours; a working build measures ~2700) and the geometry (0px of
      # letterbox, which stretch/aspect=expand guarantees), so a blank frame or a
      # return of the 19.1% letterbox fails here rather than printing a number
      # nobody reads.
      - name: The exported build must boot and render
        run: npm run web:boot-smoke
